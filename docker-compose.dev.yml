services:
  tapedeck-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tapedeck-dev
    ports:
      - "3001:3001"  # App server
      - "3002:3002"  # Air proxy with auto-refresh
    volumes:
      # Mount source code for live editing
      - .:/app
      # Persist data directory
      - ./data:/data
      # Use volume for tmp to avoid permission issues
      - air-tmp:/app/tmp
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATA_DIR=/data
      - DEV_MODE=true
      - PUID=1000
      - PGID=100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  air-tmp:
